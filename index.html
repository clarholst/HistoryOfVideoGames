                setDialogue('…', 'The corridor waits.', [
                    { label: 'Talk to Haruki', action: () => interactWithHaruki() },

                    { label: 'Return to your apartment', action: () => { renderApartment();
                            presentApartmentChoices(); } },
                ]);
            }

            // ==================== OUTSIDE DISTRICT ====================
            async function goOutsideDistrict() {

                sceneEl.className = 'scene-outside';
                state.currentLocation = 'outside';

                sceneEl.innerHTML = `
                    <div class="outside-ground"></div>
                    <div class="outside-node outside-store" id="outside-store" data-label="KONBINI"></div>
                    <div class="outside-node outside-shrine" id="outside-shrine" data-label="SHRINE GARDEN"></div>
                    <div class="outside-node outside-bridge" id="outside-bridge" data-label="RAIL BRIDGE"></div>
                    <div class="outside-node outside-alley" id="outside-alley" data-label="GRAFFITI ALLEY"></div>
                    <div class="outside-node outside-lantern" id="outside-lantern" data-label="LANTERN COURT"></div>
                `;

                bindSceneAction('outside-store', goToStore);
                bindSceneAction('outside-shrine', goToShrineGarden);
                bindSceneAction('outside-bridge', goToRailBridge);
                bindSceneAction('outside-alley', goToGraffitiAlley);
                bindSceneAction('outside-lantern', goToLanternCourt);

                setDialogue('…',
                    'You step into the district. The evening stretches wider than before: shrine bells, rail vibrations, neon, and shadowed murals all waiting.', [

                        { label: 'Visit the shrine garden', action: () => goToShrineGarden() },
                        { label: 'Walk to the rail bridge', action: () => goToRailBridge() },

                    ]);

            async function goToLanternCourt() {
                if (!state.loopActive) return;
                clearScene();
                sceneEl.className = 'scene-lantern-court';
                state.currentLocation = 'lantern-court';
                sceneEl.innerHTML = `
                    <div class="outside-silhouette left"></div>
                    <div class="outside-silhouette right"></div>
                    <div class="outside-focus" id="focus-lantern" title="Lantern circle"></div>
                    <div class="outside-path"></div>
                `;
                if (outsideAreaLocked('lantern-court')) {
                    setDialogue('…', 'Lantern Court is quiet now. You already made your choice here tonight.', [

                bindSceneAction('focus-lantern', async () => {
                    if (!beginOutsideAreaChoice('lantern-court', 'lantern-talk')) return;

                });
                setDialogue('…',
                    'Paper lanterns sway in a wind you cannot feel. Warm light pools across wet stone. Someone is waiting in that glow.', [
                        { label: 'Speak with Mikkel', action: async () => {
                                if (!beginOutsideAreaChoice('lantern-court', 'lantern-talk')) return;
                                await talkAerin();
                            } },
                        { label: 'Stand still and breathe', action: async () => {
                                if (!beginOutsideAreaChoice('lantern-court', 'lantern-breathe')) return;
                                markKindAction('grounded at lantern court', 2);
                                setDialogue('…', 'You count your breaths until your pulse slows. One choice made. The rest of this place closes for tonight.');
                                await waitForNext();
                                goToLanternCourt();
                            } },
                        { label: 'Return to district', action: () => goOutsideDistrict() },
                    ]);
            }

            async function goToRailBridge() {
                if (!state.loopActive) return;
                clearScene();
                sceneEl.className = 'scene-rail-bridge';
                state.currentLocation = 'rail-bridge';
                sceneEl.innerHTML = `
                    <div class="outside-silhouette left"></div>
                    <div class="outside-focus" id="focus-bridge" title="Bridge overlook"></div>
                    <div class="outside-path"></div>
                `;
                if (outsideAreaLocked('rail-bridge')) {
                    setDialogue('…', 'The bridge hums beneath your feet. You already made your choice here tonight.', [
                        { label: 'Return to district', action: () => goOutsideDistrict() },
                    ]);
                    return;
                }
                bindSceneAction('focus-bridge', async () => {
                    if (!beginOutsideAreaChoice('rail-bridge', 'bridge-talk')) return;
                    await talkElion();
                });
                setDialogue('…',
                    'Trains pass below in strict intervals, as if the city itself is a metronome. A traveler leans on the railing, looking lost.', [
                        { label: 'Speak with Sven', action: async () => {
                                if (!beginOutsideAreaChoice('rail-bridge', 'bridge-talk')) return;
                                await talkElion();
                            } },
                        { label: 'Watch the trains', action: async () => {
                                if (!beginOutsideAreaChoice('rail-bridge', 'bridge-watch')) return;
                                setDialogue('…', 'Two trains pass. Then the same two pass again. The pattern is too exact to be chance.');
                                await waitForNext();
                                goToRailBridge();
                            } },
                        { label: 'Return to district', action: () => goOutsideDistrict() },
                    ]);
            }

            async function goToShrineGarden() {
                if (!state.loopActive) return;
                clearScene();
                sceneEl.className = 'scene-shrine-garden';
                state.currentLocation = 'shrine-garden';
                sceneEl.innerHTML = `
                    <div class="outside-silhouette right"></div>
                    <div class="outside-focus" id="focus-shrine" title="Shrine altar"></div>
                    <div class="outside-path"></div>
                `;
                if (outsideAreaLocked('shrine-garden')) {
                    setDialogue('…', 'Only drifting incense remains. You already made your choice here tonight.', [
                        { label: 'Return to district', action: () => goOutsideDistrict() },
                    ]);
                    return;
                }
                bindSceneAction('focus-shrine', async () => {
                    if (!beginOutsideAreaChoice('shrine-garden', 'shrine-talk')) return;
                    await talkNyra();
                });
                setDialogue('…',
                    'Incense smoke hangs low among dark trees. Moss-covered stone and old offerings frame a quiet altar.', [
                        { label: 'Speak with Greta', action: async () => {
                                if (!beginOutsideAreaChoice('shrine-garden', 'shrine-talk')) return;
                                await talkNyra();
                            } },
                        { label: 'Clean the offering bowl', action: async () => {
                                if (!beginOutsideAreaChoice('shrine-garden', 'shrine-clean')) return;
                                markKindAction('cleaned shrine bowl', 2);
                                setDialogue('…', 'You wipe away ash and rainwater. The air grows a little calmer around you.');
                                await waitForNext();
                                goToShrineGarden();
                            } },
                        { label: 'Rip up sacred moss', action: async () => {
                                if (!beginOutsideAreaChoice('shrine-garden', 'shrine-rip')) return;
                                markCruelAction('damaged shrine garden', 18, 4);
                                setDialogue('…', 'Your fingers tear through roots and moss. The shrine falls silent in a way that feels accusatory.');
                                await waitForNext();
                                goToShrineGarden();
                            } },
                        { label: 'Return to district', action: () => goOutsideDistrict() },
                    ]);
            }

            async function goToGraffitiAlley() {
                if (!state.loopActive) return;
                clearScene();
                sceneEl.className = 'scene-graffiti-alley';
                state.currentLocation = 'graffiti-alley';
                sceneEl.innerHTML = `
                    <div class="outside-silhouette left"></div>
                    <div class="outside-focus" id="focus-alley" title="Mural wall"></div>
                    <div class="outside-path"></div>
                `;
                if (outsideAreaLocked('graffiti-alley')) {
                    setDialogue('…', 'The alley stares back in silence. You already made your choice here tonight.', [
                        { label: 'Return to district', action: () => goOutsideDistrict() },
                    ]);
                    return;
                }
                bindSceneAction('focus-alley', async () => {
                    if (!beginOutsideAreaChoice('graffiti-alley', 'alley-talk')) return;
                    await talkTarn();
                });
                setDialogue('…',
                    'A narrow alley opens between shuttered buildings. The walls are layered with old paint and newer warnings.', [
                        { label: 'Speak with Vaelor', action: async () => {
                                if (!beginOutsideAreaChoice('graffiti-alley', 'alley-talk')) return;
                                await talkTarn();
                            } },
                        { label: 'Study the mural', action: async () => {
                                if (!beginOutsideAreaChoice('graffiti-alley', 'alley-study')) return;
                                setDialogue('…', 'The mural changes when you look away: faces, then masks, then empty outlines.');
                                await waitForNext();
                                goToGraffitiAlley();
                            } },
                        { label: 'Deface the wall', action: async () => {
                                if (!beginOutsideAreaChoice('graffiti-alley', 'alley-deface')) return;
                                markCruelAction('defaced alley mural', 16, 4);
                                setDialogue('…', 'You carve through fresh paint. For a second, the alley smells like iron instead of spray paint.');
                                await waitForNext();
                                goToGraffitiAlley();
                            } },
                        { label: 'Return to district', action: () => goOutsideDistrict() },
                    ]);
            }

            function returnToSpiritLocation() {
                if (state.currentLocation === 'lantern-court') return goToLanternCourt();
                if (state.currentLocation === 'rail-bridge') return goToRailBridge();
                if (state.currentLocation === 'shrine-garden') return goToShrineGarden();
                if (state.currentLocation === 'graffiti-alley') return goToGraffitiAlley();
                return goOutsideDistrict();
            }

            async function talkAerin() {
                if (!state.loopActive) return;
                const hostile = state.cruelChoicesTotal > state.kindChoicesTotal + 2;
                const opening = hostile ?
                    'Mikkel stands under a paper lantern, hands in his coat pockets. "People here are polite, but some nights I still feel like an outsider watching through glass."' :
                    'Mikkel smiles and offers a warm nod. "I\'m from Aarhus. Moved here for work. Beautiful city, but it takes time before it feels like home."';
                setDialogue('Mikkel', opening, [
                    {
                        label: '"What helps you settle in?"',
                        action: async () => {
                            state.aerinAffinity = Math.min(10, state.aerinAffinity + 2);
                            markKindAction('trusted Mikkel', 1);
                            setDialogue('Mikkel',
                                '"Rituals," he says. "Watering a plant. Learning your neighbors\' names. Small care makes a foreign place feel less foreign."');
                            await waitForNext();
                            returnToSpiritLocation();
                        },
                    },
                    {
                        label: '"You\'ll never belong here."',
                        action: async () => {
                            state.aerinAffinity = Math.max(0, state.aerinAffinity - 2);
                            markCruelAction('rejected Mikkel', 20, 5);
                            setDialogue('Mikkel',
                                'His jaw tightens. "Maybe. But I\'ll still keep trying."');
                            await waitForNext();
                            returnToSpiritLocation();
                        },
                    },
                ]);
            }

            async function talkElion() {
                if (!state.loopActive) return;
                const warm = state.kindChoicesTotal >= state.cruelChoicesTotal;
                const opening = warm ?
                    'Sven leans on the railing, scarf pulled tight. "I\'m from Gothenburg. Tokyo is louder than home, but I\'m starting to love the noise."' :
                    'Sven keeps his eyes on the tracks. "Some nights I miss Sweden enough to feel it in my chest. I hate that feeling."';
                setDialogue('Sven', opening, [
                    {
                        label: 'Offer help',
                        action: async () => {
                            state.elionTrust = Math.min(10, state.elionTrust + 2);
                            markKindAction('helped Sven', 2);
                            setDialogue('Sven',
                                '"Thanks. Maybe tomorrow you can show me a quiet place nearby," he says. "I still get lost."');
                            await waitForNext();
                            returnToSpiritLocation();
                        },
                    },
                    {
                        label: 'Exploit his confusion',
                        action: async () => {
                            state.elionTrust = Math.max(0, state.elionTrust - 3);
                            markCruelAction('manipulated Sven', 25, 6);
                            setDialogue('Sven',
                                'He frowns and steps back. "I trusted the wrong person tonight."');
                            await waitForNext();
                            returnToSpiritLocation();
                        },
                    },
                ]);
            }

            async function talkNyra() {
                if (!state.loopActive) return;
                const plantLine = state.plantHealth >= 2 ?
                    '"Your hands look like someone who still cares for living things."' :
                    '"You look tired, like someone carrying too much and dropping what matters."';
                setDialogue('Greta',
                    `Greta adjusts her gloves and kneels near the moss. ${plantLine} "I moved from Berlin to study shrine ecology. I came for plants, stayed for the quiet."`, [
                        {
                            label: 'Help with her notes',
                            action: async () => {
                                state.nyraBalance = Math.min(10, state.nyraBalance + 2);
                                markKindAction('listened to Greta', 1);
                                setDialogue('Greta',
                                    '"Thank you," she says. "Most people rush past this place. You actually looked."');
                                await waitForNext();
                                returnToSpiritLocation();
                            },
                        },
                        {
                            label: 'Mock her research',
                            action: async () => {
                                state.nyraBalance = Math.max(0, state.nyraBalance - 2);
                                markCruelAction('mocked Greta', 18, 4);
                                setDialogue('Greta',
                                    'Her expression cools. "You don\'t have to respect me, but at least respect this place."');
                                await waitForNext();
                                returnToSpiritLocation();
                            },
                        },
                    ]);
            }

            async function talkTarn() {
                if (!state.loopActive) return;
                state.tarnWarnings++;
                const deathWarning = state.deathCount >= 2 ?
                    'Vaelor speaks softly, accent hard to place. "Some nights this city feels like a maze. People can get sharp when they are lonely."' :
                    'Vaelor stands by the mural with paint on his sleeves. "I\'m new here. Street art pays little, but at least it tells the truth."';
                setDialogue('Vaelor', deathWarning, [
                    {
                        label: 'Ask about his art',
                        action: async () => {
                            markKindAction('heard Vaelor', 1);
                            setDialogue('Vaelor',
                                '"I paint migrants, runaways, and workers," he says. "People who are seen but not noticed."');
                            await waitForNext();
                            returnToSpiritLocation();
                        },
                    },
                    {
                        label: 'Threaten him to move',
                        action: async () => {
                            markCruelAction('embraced Vaelor warning', 30, 8);
                            setDialogue('Vaelor',
                                'He raises his hands and steps away from the wall. "Fine. It\'s yours. I\'ll find another alley."');
                            await waitForNext();
                            await triggerHallucination('future you is still here');
                            returnToSpiritLocation();
                        },
                    },
                ]);
            }

            // ==================== STORE SCENE ====================
            async function goToStore() {
                if (!state.loopActive) return;
                clearScene();
                sceneEl.className = 'scene-store';
                state.currentLocation = 'store';

                sceneEl.innerHTML = `
                    <div class="store-light-fixture"></div>
                    <div class="store-shelf" id="click-shelf" title="Browse shelves"></div>
                    <div class="store-counter" id="click-counter" title="Counter"></div>
                    <div class="store-exit" id="click-store-exit" title="Go back"></div>
                `;

                bindSceneAction('click-shelf', browseStore);
                bindSceneAction('click-counter', approachCounter);
                bindSceneAction('click-store-exit', async () => {
                    clearScene();
                    sceneEl.className = 'scene-outside';
                    state.currentLocation = 'outside';
                    goOutsideDistrict();
                });

                setDialogue('…',
                    'The convenience store is bright and sterile. Rows of packaged snacks, drinks, and everyday necessities. The clerk barely glances up.',
                    [
                        { label: 'Browse the shelves', action: () => browseStore() },
                        { label: 'Approach the counter', action: () => approachCounter() },
                        { label: 'Return to district', action: () => { clearScene();
                            sceneEl.className = 'scene-outside';
                            state.currentLocation = 'outside';
                            goOutsideDistrict(); } },
                    ]);
            }

            async function browseStore() {
                if (!state.loopActive) return;
                const items = [
                    'Onigiri, neatly wrapped. The same brand as always.',
                    'A row of canned coffee. You consider buying one, but the thought passes.',
                    'Instant ramen. Comforting in its predictability.',
                ];
                if (state.loopCount >= 3) {
                    items.push('Everything is exactly where it was last time. The same products. The same prices. The same...');
                }
                // Show a random item description then present purchase options
                setDialogue('…', items[Math.floor(Math.random() * items.length)]);
                await waitForNext();
                setDialogue('…', 'The store hums with fluorescent light. You can buy something if you like.', [
                    { label: 'Buy Strong Zero (beer)', action: () => buyItem('strong-zero') },
                    { label: 'Buy Onigiri', action: () => buyItem('onigiri') },
                    { label: 'Buy Instant Ramen', action: () => buyItem('ramen') },
                    { label: 'Return to district', action: () => { clearScene(); sceneEl.className = 'scene-outside'; state.currentLocation = 'outside'; goOutsideDistrict(); } },
                ]);
            }

            // Purchase handling
            async function buyItem(itemKey) {
                if (!state.loopActive) return;
                if (itemKey === 'strong-zero') {
                    markCruelAction('bought strong zero', 22, 8);
                    state.harukiTrust = Math.max(0, state.harukiTrust - 1);
                    setDialogue('…', 'You grab a can of Strong Zero from the shelf. It tastes sharp and empty. The clerk does not look pleased, but he does not stop you.' );
                    await waitForNext();
                    setDialogue('…', 'You drink it cold and fast. The burn goes straight to your head. Your vision wavers.');
                    await waitForNext();
                    setDialogue('…', 'The world tilts. You collapse to the floor of the store, the fluorescent lights buzzing overhead. When you wake, the evening has reset and your choices are gone.' );
                    // harsh mental penalty to reflect a bad choice
                    state.mentalState = Math.max(5, state.mentalState - 26);
                    await waitForNext();
                    endLoop('passed-out');
                    return;
                }

                if (itemKey === 'onigiri') {
                    markKindAction('bought onigiri', 2);
                    setDialogue('…', 'You buy an onigiri. It feels comforting, small, familiar, warm in your hands.');
                    await waitForNext();
                    setDialogue('…', 'You eat it and feel a little steadier.');
                    await waitForNext();
                    setDialogue('…', 'The store hums with fluorescent light.', [
                        { label: 'Approach the counter', action: () => approachCounter() },
                                { label: 'Return to district', action: () => { clearScene(); sceneEl.className = 'scene-outside'; state.currentLocation = 'outside'; goOutsideDistrict(); } },
                    ]);
                    return;
                }

                if (itemKey === 'ramen') {
                    markKindAction('bought ramen', 1);
                    setDialogue('…', 'You buy some instant ramen. The packet promises warmth and predictable taste.');
                    await waitForNext();
                    setDialogue('…', 'You put it in your bag and step back toward the district streets.', [
                        { label: 'Return to district', action: () => { clearScene(); sceneEl.className = 'scene-outside'; state.currentLocation = 'outside'; goOutsideDistrict(); } },
                    ]);
                    return;
                }
            }

            async function approachCounter() {
                if (!state.loopActive) return;
                setDialogue('…',
                    'The clerk looks up. A tired young man with kind eyes. "Find everything okay?" There\'s something familiar about his tone. But of course there is, you\'ve been here before. Many times.'
                    );
                await waitForNext();
                setDialogue('…', 'Your chest tightens. You can answer with care, or let the loop strip that away.', [
                    {
                        label: 'Speak politely',
                        action: async () => {
                            markKindAction('spoke kindly to clerk', 1);
                            setDialogue('…', 'You thank him and step aside. For a second, your thoughts settle.');
                            await waitForNext();
                            setDialogue('…', 'The store hums with fluorescent light.', [
                                { label: 'Browse shelves', action: () => browseStore() },
                                { label: 'Return to district', action: () => { clearScene(); sceneEl.className = 'scene-outside'; state.currentLocation = 'outside'; goOutsideDistrict(); } },
                            ]);
                        },
                    },
                    {
                        label: 'Attack the clerk without thinking',
                        action: () => thoughtlessKillAtStore(),
                        special: true,
                    },
                    { label: 'Back away', action: () => browseStore() },
                ]);
            }

            async function thoughtlessKillAtStore() {
                if (!state.loopActive) return;
                markCruelAction('killed without thought', 45, 12);
                setDialogue('…',
                    'Your hand moves before your mind does. A flash of violence. A scream. Then silence. The shelves stare back at you like witnesses.'
                );
                await waitForNext();
                setDialogue('…',
                    'Blood on tile. Breath shaking. You wanted to feel nothing, but the loop makes sure you feel everything.'
                );
                await waitForNext();
                state.mentalState = Math.max(5, state.mentalState - 18);
                await triggerHallucination('no consequence outside, all consequence inside');
                endLoop('murder-collapse');
            }

            // ==================== ENDINGS ====================
            async function triggerTrueEnding() {
                state.loopActive = false;
                if (state.loopTimerInterval) {
                    clearInterval(state.loopTimerInterval);
                    state.loopTimerInterval = null;
                }
                if (dialogueArea) dialogueArea.style.display = 'none';
                clearScene();
                sceneEl.innerHTML = '';
                sceneEl.style.top = '0';
                sceneEl.style.bottom = '0';
                sceneEl.style.height = '100%';
                sceneEl.style.background = 'linear-gradient(180deg, #f5e6d0 0%, #e8d5b8 40%, #d4c4a8 100%)';
                sceneEl.style.display = 'flex';
                sceneEl.style.alignItems = 'center';
                sceneEl.style.justifyContent = 'center';
                sceneEl.style.flexDirection = 'column';
                sceneEl.style.textAlign = 'center';
                sceneEl.style.padding = '40px';
                const endDiv = document.createElement('div');
                endDiv.innerHTML = `
                    <div style="font-size:28px;color:#6b4e3d;letter-spacing:0.1em;margin-bottom:16px;">MIND'S ECLIPSE</div>
                    <div style="font-size:15px;color:#8b6f5e;line-height:1.8;max-width:350px;">
                        The loop breaks not with a bang,<br>but with a hand held in the dark.<br><br>
                        Haruki remembers. You remember.<br>
                        Two minds, eclipsed no longer.<br><br>
                        <span style="color:#4a7a3a;">The plant blooms.</span><br>
                        <span style="color:#d4a574;">The graffiti fades.</span><br>
                        <span style="color:#5a6a7a;">Morning comes.</span>
                    </div>
                    <div style="margin-top:30px;font-size:12px;color:#a09080;letter-spacing:0.15em;">
                        TRUE ENDING
                    </div>
                `;
                sceneEl.appendChild(endDiv);
                setDialogue('…', '');
                speakerName.textContent = '';
                timerDisplay.textContent = '';
                loopIndicator.textContent = 'MORNING - RELEASE';
                loopIndicator.style.color = 'rgba(180,160,140,0.8)';
                gameContainer.className = '';
                vignetteEl.style.opacity = '0.2';
                scanlinesEl.style.opacity = '0.1';
                await fadeFromBlack(1200);
            }

            async function triggerBadEnding() {
                state.loopActive = false;
                if (state.loopTimerInterval) {
                    clearInterval(state.loopTimerInterval);
                    state.loopTimerInterval = null;
                }
                if (dialogueArea) dialogueArea.style.display = 'none';
                clearScene();
                sceneEl.innerHTML = '';
                sceneEl.style.top = '0';
                sceneEl.style.bottom = '0';
                sceneEl.style.height = '100%';
                sceneEl.style.background = '#0a0a12';
                sceneEl.style.display = 'flex';
                sceneEl.style.alignItems = 'center';
                sceneEl.style.justifyContent = 'center';
                sceneEl.style.flexDirection = 'column';
                sceneEl.style.textAlign = 'center';
                const endDiv = document.createElement('div');
                endDiv.innerHTML = `
                    <div style="font-size:24px;color:#3a2a2a;letter-spacing:0.15em;margin-bottom:16px;">MIND'S ECLIPSE</div>
                    <div style="font-size:14px;color:#5a4040;line-height:1.8;max-width:320px;">
                        The mind erodes.<br>
                        The loops blur together.<br>
                        Haruki's face becomes a stranger's.<br>
                        The plant is dust.<br><br>
                        <span style="color:#3a2020;">You forget what you were trying to remember.</span><br><br>
                        The eclipse is total.
                    </div>
                    <div style="margin-top:30px;font-size:11px;color:#4a3030;letter-spacing:0.12em;">
                        BAD ENDING
                    </div>
                `;
                sceneEl.appendChild(endDiv);
                setDialogue('…', '');
                speakerName.textContent = '';
                timerDisplay.textContent = '';
                loopIndicator.textContent = 'DARKNESS - END';
                loopIndicator.style.color = 'rgba(80,40,40,0.6)';
                gameContainer.className = 'degraded-critical';
                vignetteEl.style.opacity = '0.8';
                scanlinesEl.style.opacity = '0.7';
                await fadeFromBlack(1500);
            }

            // ==================== GAME INITIALIZATION ====================
            async function initGame() {
                state.loopCount = 0;
                state.mentalState = 100;
                state.plantHealth = 3;
                state.plantWateredThisLoop = false;
                state.harukiTrust = 0;
                state.harukiInteractionsThisLoop = false;
                state.harukiTalksThisLoop = 0;
                state.readNoticeThisLoop = false;
                state.graffitiLevel = 0;
                state.kindChoicesTotal = 0;
                state.cruelChoicesTotal = 0;
                state.cruelStreak = 0;
                state.dialogueHistory = [];
                state.recentKindActions = [];
                state.recentCruelActions = [];
                state.loopDuration = 150;
                state.deathCount = 0;
                state.aerinAffinity = 0;
                state.elionTrust = 0;
                state.nyraBalance = 0;
                state.tarnWarnings = 0;
                state.lastLoopReason = null;
                state.outsideAreaChoiceUsed = {
                    'lantern-court': false,
                    'rail-bridge': false,
                    'shrine-garden': false,
                    'graffiti-alley': false,
                };
                state.usedOutsideChoices = [];
                state.trueEndingUnlocked = false;
                state.trueEndingTriggered = false;
                state.badEndingTriggered = false;
                state.loopActive = true;
                state.currentLocation = 'apartment';

                gameContainer.className = '';
                vignetteEl.style.opacity = '0.35';
                scanlinesEl.style.opacity = '0.4';
                loopIndicator.textContent = 'NIGHT LOOP';
                loopIndicator.style.color = 'rgba(255,255,255,0.3)';
                loopIndicator.style.opacity = '0.7';
                timerDisplay.style.color = 'rgba(255,255,255,0.25)';
                speakerName.textContent = '';
                dialogueText.textContent = '';
                clearChoices();
                clearScene();
                fadeOverlay.classList.remove('active');

                if (sceneEl) {
                    sceneEl.style.top = '0';
                    sceneEl.style.bottom = '200px';
                    sceneEl.style.height = '';
                }
                if (dialogueArea) dialogueArea.style.display = 'flex';
                renderApartment();
                applyDegradation();
                updateTimerDisplay();
                startLoopTimer();
                await fadeFromBlack(800);

                setDialogue('…', 'You wake up in your apartment. Evening light filters through the window.');
                await waitForNext();
                setDialogue('…', 'Everything is as it should be. The plant sits on its shelf. The futon is warm beneath you.');
                await waitForNext();
                presentApartmentChoices();
            }

            // ==================== TITLE SCREEN ====================
            titleOverlay.addEventListener('click', async () => {
                titleOverlay.classList.add('hidden');
                await new Promise(r => setTimeout(r, 500));
                initGame();
            });

            // Allow starting with Enter key too
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !titleOverlay.classList.contains('hidden') === false) {
                    if (!state.loopActive && state.loopCount === 0 && !state.trueEndingTriggered && !state
                        .badEndingTriggered) {
                        // Initial state before title click
                    }
                }
                if (e.key === 'Enter' && titleOverlay.classList.contains('hidden') === false) {
                    titleOverlay.click();
                }
            });

            // Initial setup
            sceneEl.innerHTML = '';
            speakerName.textContent = '';
            dialogueText.textContent = '';
            timerDisplay.textContent = '';
            loopIndicator.textContent = '';
            gameContainer.className = '';

            console.log('Mind\'s Eclipse');
            console.log('A time-loop narrative game');
            console.log('Click the title screen to begin.');
            console.log('Pay attention. Your choices matter.');
            console.log('The plant remembers. Haruki remembers.');
            console.log('Break the loop by connecting.');
        })();
    </script>
    <script>
        function setViewportHeight() {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
        }
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);
    </script>
</body>
</html>
